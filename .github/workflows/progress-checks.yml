name: Progress checks

on:
  push:
    branches: [main, ci/progress-checks]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  progress-tests:
    name: Progress tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out the proposed code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check desktop entry syntax
        run: node --check src/main.cjs
      - name: Check page behavior syntax
        run: node --check src/renderer.js
      - name: Check chapter data and screens syntax
        run: |
          node --check src/course.js
          node --check src/course-ui.js
      - name: Verify progress and note storage
        run: node --test tests/progress.test.cjs tests/course.test.cjs
